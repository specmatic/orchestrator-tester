name: Build and Trigger Orchestrator

on:
  workflow_dispatch:
    inputs:
      orchestrator_repository:
        description: Repository that hosts the orchestrator workflow
        required: false
        default: specmatic/specmatic-tests-orchestrator
        type: string
      orchestrator_event_type:
        description: repository_dispatch event type to send
        required: false
        default: specmatic-enterprise-jar-ready
        type: string
      ORCHESTRATOR_TEST_EXECUTOR_PATH:
        description: Optional manifest path. Defaults to a synthetic tester manifest for 0.0.0-DUMMY.
        required: false
        type: string
      ENTERPRISE_VERSION:
        description: Enterprise selector. Use 0.0.0-DUMMY for the default dummy jar tester flow.
        required: false
        default: 0.0.0-DUMMY
        type: string

jobs:
  build-and-trigger:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    permissions:
      statuses: write
      contents: write
    steps:
      - name: Checkout orchestrator-tester
        uses: actions/checkout@v5

      - name: Simulate Enterprise build (${{ matrix.os }})
        shell: bash
        run: |
          set -euo pipefail
          echo "Simulating Enterprise build on ${{ matrix.os }}"

      - name: Create pending orchestrator status
        if: github.event_name == 'workflow_dispatch' && matrix.os == 'ubuntu-latest'
        env:
          STATUS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          for configuration in ubuntu-latest windows-latest; do
            if [ "${configuration}" = "ubuntu-latest" ]; then
              status_context="Ubuntu - Specmatic Orchestrator Gate"
            else
              status_context="Windows - Specmatic Orchestrator Gate"
            fi
            curl -sS -X POST \
              -H "Authorization: Bearer ${STATUS_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d '{"state":"pending","target_url":"'"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"'","description":"Waiting for orchestrator tests for '"${configuration}"'.","context":"'"${status_context}"'"}'
            echo "Created pending commit status for ${configuration}: ${status_url}"
          done
          python3 - <<'PY'
          import json
          import os
          import subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["STATUS_TOKEN"]
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          raw = subprocess.check_output(
              [
                  "curl",
                  "-sS",
                  "-H",
                  f"Authorization: Bearer {token}",
                  "-H",
                  "Accept: application/vnd.github+json",
                  "-H",
                  "X-GitHub-Api-Version: 2022-11-28",
                  f"https://api.github.com/repos/{repo}/commits/{sha}/status",
              ],
              text=True,
          )
          contexts = {
              status.get("context")
              for status in json.loads(raw).get("statuses", [])
              if str(status.get("context", "")).startswith("Orchestrator Gate for run ")
          }
          for context in sorted(contexts):
              subprocess.check_call(
                  [
                      "curl",
                      "-sS",
                      "-X",
                      "POST",
                      "-H",
                      f"Authorization: Bearer {token}",
                      "-H",
                      "Accept: application/vnd.github+json",
                      "-H",
                      "X-GitHub-Api-Version: 2022-11-28",
                      f"https://api.github.com/repos/{repo}/statuses/{sha}",
                      "-d",
                      json.dumps(
                          {
                              "state": "success",
                              "target_url": run_url,
                              "description": "Superseded by Specmatic Orchestrator Gate.",
                              "context": context,
                          }
                      ),
                  ]
              )
          PY
          {
            echo "## Specmatic Orchestrator Gates for enterprise run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT} (pending)"
            echo ""
            echo "- Enterprise run id: ${GITHUB_RUN_ID}"
            echo "- Enterprise run attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "- Correlation key: ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
            echo "- Commit status: [${GITHUB_SHA:0:7}](${status_url})"
            echo "- Ubuntu context: Ubuntu - Specmatic Orchestrator Gate"
            echo "- Windows context: Windows - Specmatic Orchestrator Gate"
            echo "- Orchestrator workflow: https://github.com/specmatic/specmatic-tests-orchestrator/actions/workflows/specmatic-enterprise-jar-tests.yml"
            echo "- Result details: callbacks update each gate's Details link to the exact specmatic-tests-orchestrator run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger orchestrator
        if: github.event_name == 'workflow_dispatch' && matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.SPECMATIC_GITHUB_TOKEN }}
          ORCHESTRATOR_REPOSITORY: ${{ inputs.orchestrator_repository }}
          ORCHESTRATOR_EVENT_TYPE: ${{ inputs.orchestrator_event_type }}
          ORCHESTRATOR_TEST_EXECUTOR_PATH: ${{ inputs.ORCHESTRATOR_TEST_EXECUTOR_PATH }}
          ENTERPRISE_VERSION: ${{ inputs.ENTERPRISE_VERSION }}
          ENTERPRISE_STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEFAULT_DUMMY_JAR_URL: https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          DEFAULT_DUMMY_ENTERPRISE_VERSION: 0.0.0-DUMMY
          DEFAULT_TEST_EXECUTOR_PATH: tests/resources/orchestrator-tester-test-executor.json
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Missing SPECMATIC_GITHUB_TOKEN repository secret."
            echo "Add a fine-grained PAT or GitHub token with access to specmatic/specmatic-tests-orchestrator."
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os

          enterprise_selector = os.environ.get("ENTERPRISE_VERSION", "").strip()
          test_executor_path = os.environ.get("ORCHESTRATOR_TEST_EXECUTOR_PATH", "").strip()
          jar_url = ""
          enterprise_version = enterprise_selector
          if not enterprise_selector:
              raise SystemExit("ENTERPRISE_VERSION is required. Use 0.0.0-DUMMY for the default tester flow.")
          if enterprise_selector == os.environ["DEFAULT_DUMMY_ENTERPRISE_VERSION"]:
              jar_url = os.environ["DEFAULT_DUMMY_JAR_URL"]
              if not test_executor_path:
                  test_executor_path = os.environ["DEFAULT_TEST_EXECUTOR_PATH"]

          for configuration in ("ubuntu-latest", "windows-latest"):
              status_context = (
                  "Ubuntu - Specmatic Orchestrator Gate"
                  if configuration == "ubuntu-latest"
                  else "Windows - Specmatic Orchestrator Gate"
              )
              payload = {
                  "event_type": os.environ["ORCHESTRATOR_EVENT_TYPE"],
                  "client_payload": {
                      "enterprise_repository": os.environ["GITHUB_REPOSITORY"],
                      "enterprise_sha": os.environ["GITHUB_SHA"],
                      "enterprise_run_id": os.environ["GITHUB_RUN_ID"],
                      "enterprise_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                      "enterprise_version": enterprise_version,
                      "enterprise_status_context": status_context,
                      "enterprise_status_target_url": os.environ["ENTERPRISE_STATUS_TARGET_URL"],
                      "enterprise_configuration": configuration,
                  },
              }
              if jar_url:
                  payload["client_payload"]["jar_url"] = jar_url
              if test_executor_path:
                  payload["client_payload"]["test_executor_path"] = test_executor_path
              print(f"Repository dispatch payload for {configuration}:")
              print(json.dumps(payload, indent=2, sort_keys=True))
          PY
          enterprise_selector="${ENTERPRISE_VERSION:-}"
          test_executor_path="${ORCHESTRATOR_TEST_EXECUTOR_PATH:-}"
          jar_url=""
          enterprise_version="${enterprise_selector}"
          if [ -z "${enterprise_selector}" ]; then
            echo "ENTERPRISE_VERSION is required. Use ${DEFAULT_DUMMY_ENTERPRISE_VERSION} for the default tester flow."
            exit 1
          fi
          if [ "${enterprise_selector}" = "${DEFAULT_DUMMY_ENTERPRISE_VERSION}" ]; then
            jar_url="${DEFAULT_DUMMY_JAR_URL}"
            if [ -z "${test_executor_path}" ]; then
              test_executor_path="${DEFAULT_TEST_EXECUTOR_PATH}"
            fi
            echo "Using default dummy jar for orchestrator-tester: ${jar_url}"
          else
            echo "Using Enterprise selector for orchestrator resolution: ${enterprise_selector}"
          fi
          if [ -n "${test_executor_path}" ]; then
            echo "Passing orchestrator manifest override: ${test_executor_path}"
          fi

          for configuration in ubuntu-latest windows-latest; do
            if [ "${configuration}" = "ubuntu-latest" ]; then
              status_context="Ubuntu - Specmatic Orchestrator Gate"
            else
              status_context="Windows - Specmatic Orchestrator Gate"
            fi
            args=(
              -f "event_type=${ORCHESTRATOR_EVENT_TYPE}"
              -f "client_payload[enterprise_repository]=${GITHUB_REPOSITORY}"
              -f "client_payload[enterprise_sha]=${GITHUB_SHA}"
              -f "client_payload[enterprise_run_id]=${GITHUB_RUN_ID}"
              -f "client_payload[enterprise_run_attempt]=${GITHUB_RUN_ATTEMPT}"
              -f "client_payload[enterprise_version]=${enterprise_version}"
              -f "client_payload[enterprise_status_context]=${status_context}"
              -f "client_payload[enterprise_status_target_url]=${ENTERPRISE_STATUS_TARGET_URL}"
              -f "client_payload[enterprise_configuration]=${configuration}"
            )
            if [ -n "${jar_url}" ]; then
              args+=(-f "client_payload[jar_url]=${jar_url}")
            fi
            if [ -n "${test_executor_path}" ]; then
              args+=(-f "client_payload[test_executor_path]=${test_executor_path}")
            fi
            echo "Dispatching orchestrator for ${configuration}"
            gh api "repos/${ORCHESTRATOR_REPOSITORY}/dispatches" -X POST "${args[@]}"
          done
